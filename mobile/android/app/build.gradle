apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.treq.mobile"
    defaultConfig {
        applicationId "com.treq.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("TREQ_VERSION_CODE") ?: "1")
        versionName System.getenv("TREQ_VERSION_NAME") ?: "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Populated from env vars in CI (see .github/workflows/mobile-release.yml
            // and mobile/android/fastlane/Fastfile); falls back to the debug keystore
            // for local `assembleDebug`/unsigned dev builds so this block never breaks
            // a build that isn't trying to produce a release artifact.
            def storePath = System.getenv("TREQ_ANDROID_KEYSTORE_PATH")
            storeFile storePath ? file(storePath) : file('debug.keystore')
            storePassword System.getenv("TREQ_ANDROID_KEYSTORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("TREQ_ANDROID_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("TREQ_ANDROID_KEY_PASSWORD") ?: 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // TreqSshModule.kt/TreqSshPackage.kt call into UniFFI-generated Kotlin
    // bindings (uniffi/treq_mobile_ssh/treq_mobile_ssh.kt, generated by the
    // generateTreqMobileSshBindings task below), which use JNA to load the
    // native library.
    implementation("net.java.dev.jna:jna:5.14.0@aar")
}

// Generates the UniFFI Kotlin bindings for crates/treq-mobile-ssh from
// source, so TreqSshModule.kt has a real `uniffi.treq_mobile_ssh.SshClient`
// to compile against instead of a vendored, driftable copy (see
// mobile/README.md "Building the Rust side"). Building the actual
// per-ABI .so files for jniLibs (aarch64/armv7/x86_64 Android targets via
// `cargo ndk`) is a separate step this task does not do - it only makes
// the Kotlin API surface resolvable at compile time.
def treqMobileSshCrateDir = file("${rootDir}/../../crates/treq-mobile-ssh")
// Written straight into src/main/java (gitignored - see mobile/.gitignore)
// rather than a build/generated/ dir: registering an extra Kotlin source
// dir through the AGP+Kotlin-Android plugin combination used here did not
// take effect for compileDebugKotlin (tried both
// `android.sourceSets.main.java.srcDirs +=` and, in `afterEvaluate`,
// `android.sourceSets.main.kotlin.srcDir(...)` - neither made the
// generated file visible to the Kotlin compiler task, confirmed by
// `Unresolved reference: SshClient` persisting across both). Writing
// directly into the real source tree sidesteps that entirely.
def treqMobileSshBindingsDir = file("${projectDir}/src/main/java")

tasks.register("generateTreqMobileSshBindings", Exec) {
    inputs.dir(fileTree(treqMobileSshCrateDir) { exclude "target" })
    outputs.file("${treqMobileSshBindingsDir}/uniffi/treq_mobile_ssh/treq_mobile_ssh.kt")
    workingDir = treqMobileSshCrateDir
    commandLine "cargo", "run", "--quiet", "--bin", "uniffi-bindgen", "--",
        "generate", "--library", "${rootDir}/../../target/debug/libtreq_mobile_ssh.so",
        "--language", "kotlin", "--out-dir", treqMobileSshBindingsDir.path
    doFirst {
        exec {
            workingDir = treqMobileSshCrateDir
            commandLine "cargo", "build", "--quiet", "--lib"
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn("generateTreqMobileSshBindings")
}

// Builds the real per-ABI libtreq_mobile_ssh.so files (via `cargo ndk`,
// https://github.com/bbqsrc/cargo-ndk) that TreqSshModule.kt's JNA-backed
// UniFFI bindings load at runtime, and copies them into jniLibs/ so a full
// `assembleDebug`/`assembleRelease` links them into the APK - the gap
// generateTreqMobileSshBindings above deliberately leaves open (it only
// makes the Kotlin API surface compile, not link). Needs `cargo install
// cargo-ndk` and `rustup target add aarch64-linux-android
// armv7-linux-androideabi x86_64-linux-android i686-linux-android`, and
// ANDROID_NDK_HOME set - see mobile/README.md "Building the Rust side".
def treqMobileSshJniLibsDir = file("${projectDir}/src/main/jniLibs")

tasks.register("buildTreqMobileSshNativeLibs", Exec) {
    inputs.dir(fileTree(treqMobileSshCrateDir) { exclude "target" })
    outputs.dir(treqMobileSshJniLibsDir)
    workingDir = treqMobileSshCrateDir
    commandLine "cargo", "ndk",
        "-t", "arm64-v8a", "-t", "armeabi-v7a", "-t", "x86_64", "-t", "x86",
        "-o", treqMobileSshJniLibsDir.path,
        "build", "--release"
}

tasks.named("preBuild").configure {
    dependsOn("buildTreqMobileSshNativeLibs")
}
