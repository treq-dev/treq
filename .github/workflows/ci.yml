name: CI

defaults:
  run:
    shell: bash

env:
  # Disable incremental compilation for faster from-scratch builds
  CARGO_INCREMENTAL: 0
  # Skip debug info for test binaries: faster builds, smaller artifacts
  CARGO_PROFILE_TEST_DEBUG: 0

on:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/tauri-test-macros/**"
      - "supabase/**"
      - "web/**"
      - "test/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - "vitest*.config.ts"
      - "eslint.config.ts"
      - "knip.json"
      - ".github/workflows/ci.yml"

jobs:
  detect-windows-changes:
    name: detect windows-specific changes
    runs-on: ubuntu-22.04
    outputs:
      windows_changed: ${{ steps.detect.outputs.windows_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The windows-rust job is slow (45m timeout) and only ever catches
      # bugs in code that branches on the Windows target. Skip it unless
      # the diff actually touches windows-specific cfg branching so most
      # PRs don't pay for it.
      - name: Check for windows-specific branching in the diff
        id: detect
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --unified=0 "$base...$head" -- 'src-tauri/**/*.rs' \
              | grep -qE '^\+.*(cfg\(target_os = "windows"\)|cfg\(windows\)|cfg!\(windows\)|cfg!\(target_os = "windows"\))'; then
            echo "windows_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_changed=false" >> "$GITHUB_OUTPUT"
          fi

  detect-rust-changes:
    name: detect rust changes
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for src-tauri/Cargo changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - "src-tauri/**"
              - "crates/tauri-test-macros/**"
              - "Cargo.toml"
              - "Cargo.lock"

  ci:
    needs: detect-rust-changes
    timeout-minutes: ${{ matrix.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
            timeout-minutes: 15
          # Unit tests: mocked Tauri, no NAPI/jj. Parallel file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:unit
            timeout-minutes: 15
          # Integration tests: NAPI + real jj repos. Serial file execution.
          - platform: ubuntu-22.04
            kind: js
            task: test:integration
            timeout-minutes: 30
          - platform: ubuntu-22.04
            kind: rust
            task: test
            timeout-minutes: 15
          - platform: macos-latest
            kind: rust
            task: test
            timeout-minutes: 15
          - platform: windows-latest
            kind: js
            task: test:unit
            timeout-minutes: 15

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    # Rust-only jobs are skipped entirely when the diff doesn't touch
    # src-tauri or its Cargo files; verify/js jobs still run (see the
    # "Run Rust task" step below for how verify's rust checks are gated).
    if: matrix.kind != 'rust' || needs.detect-rust-changes.outputs.rust_changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          # Pin major so NAPI cache keys stay stable across LTS patch bumps.
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # Exact-key cache of the compiled addon. Frontend-only PRs restore the
      # binary built on main when Rust inputs are unchanged. Node is omitted
      # from the key: N-API (napi8) binaries are ABI-stable across Node majors
      # we care about; including `lts/*` patch versions busted the cache.
      - name: Restore NAPI addon cache
        id: napi-cache
        if: matrix.task == 'test:integration'
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/libtreq_lib.so
            src-tauri/target/index.js
          key: napi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/src/**', 'src-tauri/tests/**', 'src-tauri/package.json', 'crates/tauri-test-macros/**') }}

      - name: Install Rust stable
        # Unit JS tests never need Rust. Integration skips the toolchain when
        # the prebuilt .node addon was restored from cache.
        if: >
          matrix.kind == 'rust' ||
          matrix.kind == 'verify' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt, clippy
          toolchain: stable

      - name: Install cargo-nextest
        if: matrix.kind == 'rust'
        uses: taiki-e/install-action@nextest

      # Cold apt install of WebKit/GTK is ~30–60s per job; restore from Actions
      # cache on subsequent runs. execute_install_scripts is required so dpkg
      # postinst (ldconfig, alternatives) still runs on restore.
      - name: install dependencies (ubuntu only)
        # WebKit/GTK is needed to *link* treq/tauri (verify, rust, NAPI miss) and
        # to *dlopen* libtreq_lib.so in integration tests even on a NAPI cache hit.
        if: >
          matrix.platform == 'ubuntu-22.04' && (
            matrix.kind == 'rust' ||
            matrix.kind == 'verify' ||
            matrix.task == 'test:integration'
          )
        uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: webkit-4.1-1
          execute_install_scripts: true

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary (macOS brew of git/jj/gh was ~40s every run).
      - name: Resolve jj release tag
        id: jj
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: >
          (matrix.task == 'test:integration' || matrix.kind == 'rust') &&
          steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   target=x86_64-unknown-linux-musl ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            macOS-X64)   target=x86_64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *)
              echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"
              exit 1
              ;;
          esac
          if [ "${{ runner.os }}" = "Windows" ]; then
            asset="jj-${JJ_TAG}-${target}.zip"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              -o "$tmp/jj.zip"
            unzip -q "$tmp/jj.zip" -d "$tmp"
            jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj.exe
          else
            asset="jj-${JJ_TAG}-${target}.tar.gz"
            tmp=$(mktemp -d)
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
              | tar -xz -C "$tmp"
            # tarball may nest the binary; find it
            jj_bin=$(find "$tmp" -type f -name jj | head -n 1)
            test -n "$jj_bin"
            install -m 755 "$jj_bin" .ci-bin/jj
          fi

      - name: Save jj CLI cache
        if: >
          (matrix.task == 'test:integration' || matrix.kind == 'rust') &&
          steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        if: matrix.task == 'test:integration' || matrix.kind == 'rust'
        run: |
          git --version
          jj --version
          gh --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: >
          matrix.kind == 'rust' ||
          (matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true')
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Build NAPI addon
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        run: |
          npm run build:napi
          test -f target/debug/libtreq_lib.so
          test -f src-tauri/target/index.js

      - name: Save NAPI addon cache
        if: matrix.task == 'test:integration' && steps.napi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/libtreq_lib.so
            src-tauri/target/index.js
          key: ${{ steps.napi-cache.outputs.cache-primary-key }}

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
            npm run knip
          elif [ "${{ matrix.task }}" = "test:integration" ]; then
            npm run test:integration:run
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: >
          matrix.kind == 'rust' ||
          (matrix.kind == 'verify' && needs.detect-rust-changes.outputs.rust_changed == 'true')
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check --locked
            cargo clippy --locked --all-targets --all-features -- -D warnings
          else
            cargo nextest run --locked --no-fail-fast
          fi

  # Windows rust tests are slow (45m) and only ever catch bugs in code that
  # branches on the Windows target, so they're gated on detect-windows-changes
  # finding windows-specific cfg branching in the diff instead of running on
  # every PR.
  windows-rust-tests:
    needs: detect-windows-changes
    if: needs.detect-windows-changes.outputs.windows_changed == 'true'
    name: rust / test / windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Windows Defender's real-time scanning intercepts every process spawn
      # and file write; this job spawns hundreds of jj/git subprocesses per
      # test run, so this materially cuts wall time. Exclude the workspace
      # before checkout writes anything into it.
      - name: Disable Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # windows-latest runners ship LLVM (lld-link.exe) but link.exe from MSVC
      # is the default; switch to lld for a much faster linker on Windows.
      - name: Use lld linker
        run: |
          echo "RUSTFLAGS=-C linker=lld-link" >> "$GITHUB_ENV"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      # Runners already ship git + gh. Only jj needs installing; cache the
      # release binary.
      - name: Resolve jj release tag
        id: jj
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tag=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jj-vcs/jj/releases/latest | jq -r .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore jj CLI cache
        id: jj-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-bin
          key: jj-${{ runner.os }}-${{ runner.arch }}-${{ steps.jj.outputs.tag }}

      - name: Install jj CLI
        if: steps.jj-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JJ_TAG: ${{ steps.jj.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p .ci-bin
          asset="jj-${JJ_TAG}-x86_64-pc-windows-msvc.zip"
          tmp=$(mktemp -d)
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -L "https://github.com/jj-vcs/jj/releases/download/${JJ_TAG}/${asset}" \
            -o "$tmp/jj.zip"
          unzip -q "$tmp/jj.zip" -d "$tmp"
          jj_bin=$(find "$tmp" -type f -name jj.exe | head -n 1)
          test -n "$jj_bin"
          install -m 755 "$jj_bin" .ci-bin/jj.exe

      - name: Save jj CLI cache
        if: steps.jj-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci-bin
          key: ${{ steps.jj-cache.outputs.cache-primary-key }}

      - name: Add jj to PATH
        run: echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          git --version
          jj --version
          gh --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            ./src-tauri -> target

      - name: Run Rust task
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --no-fail-fast
