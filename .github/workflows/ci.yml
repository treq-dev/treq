name: CI

defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            kind: verify
            task: verify
          - platform: ubuntu-22.04
            kind: js
            task: test
          - platform: ubuntu-22.04
            kind: rust
            task: test
          - platform: macos-latest
            kind: rust
            task: test
          - platform: windows-latest
            kind: js
            task: test
          - platform: windows-latest
            kind: rust
            task: test

    name: ${{ matrix.kind }} / ${{ matrix.task }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          components: rustfmt
          toolchain: stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install git and jj CLI (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install git jj
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Install jj CLI (non-macOS)
        if: runner.os != 'macOS'
        run: |
          cargo binstall --strategies crate-meta-data jj-cli
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify pinned tool versions
        run: |
          git --version
          jj --version

      - name: Install dependencies
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        if: matrix.kind == 'rust'
        with:
          cache-on-failure: true
          workspaces: "./src-tauri -> target"

      - name: Run JS task
        if: matrix.kind == 'js' || matrix.kind == 'verify'
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            npm run check
            npm run check:format
            npm run lint
          else
            npm run ${{ matrix.task }}
          fi

      - name: Run Rust task
        if: matrix.kind == 'rust' || matrix.kind == 'verify'
        working-directory: src-tauri
        env:
          RUST_BACKTRACE: 1
        run: |
          if [ "${{ matrix.kind }}" = "verify" ] || [ "${{ matrix.task }}" = "verify" ]; then
            cargo fmt --check
            cargo check
          else
            cargo test --no-fail-fast
          fi
