name: Nightly Build

defaults:
  run:
    shell: bash

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if main hasn't changed since last nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          PREV_SHA=$(gh api "repos/${{ github.repository }}/git/refs/tags/nightly" \
            --jq '.object.sha' 2>/dev/null) || PREV_SHA=

          if [ "$HEAD_SHA" = "$PREV_SHA" ]; then
            echo "No new commits on main since last nightly build ($HEAD_SHA); skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  cleanup:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete pre-existing nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On 404, gh prints the error JSON to stdout, so discard output on failure.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.id' 2>/dev/null) || RELEASE_ID=

          if [ -n "$RELEASE_ID" ]; then
            echo "Deleting existing nightly release"
            gh api -X DELETE "repos/${{ github.repository }}/releases/${RELEASE_ID}"
          fi

          if gh api "repos/${{ github.repository }}/git/refs/tags/nightly" > /dev/null 2>&1; then
            echo "Deleting existing nightly tag"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/nightly"
          fi

  release:
    needs: [check, cleanup]
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            app_bundle: "target/aarch64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "macos-latest" # for Intel based macs.
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            app_bundle: "target/x86_64-apple-darwin/release/bundle/macos/Treq.app"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            # Skip the AppImage: it adds ~1.5m to every nightly. Tagged
            # releases still ship it (release.yml builds all bundles).
            args: "--target x86_64-unknown-linux-gnu --bundles deb,rpm"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ". -> target"

      - name: Install dependencies
        run: npm ci

      # Desktop only links the `treq` binary. The staticlib and cdylib crate
      # types exist for iOS/Android and the NAPI test addon, and with LTO each
      # one is a separate whole-program link, roughly tripling link time.
      - name: Build only the rlib for desktop
        run: |
          sed -i.bak 's/^crate-type = .*/crate-type = ["rlib"]/' src-tauri/Cargo.toml
          grep -qx 'crate-type = \["rlib"\]' src-tauri/Cargo.toml
          rm src-tauri/Cargo.toml.bak

      - uses: tauri-apps/tauri-action@v0
        env:
          # Nightlies trade a slightly larger binary for a much faster link.
          # Cargo.toml's release profile (fat LTO, 1 codegen unit) is kept
          # for tagged releases.
          CARGO_PROFILE_RELEASE_LTO: "thin"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: nightly
          releaseName: "Nightly Build"
          releaseBody: ""
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: true
          releaseAssetNamePattern: "[name]-nightly-[platform]-[arch][ext]"
          args: ${{ matrix.args }}

      - name: Verify packaged macOS bundle
        if: runner.os == 'macOS'
        run: bash scripts/verify-macos-bundle.sh "${{ matrix.app_bundle }}"

  # Unsigned debug mobile builds. These only run nightly (not on every PR)
  # since the Android/iOS toolchains are slow; signed builds live in mobile.yml.
  android:
    name: android build (unsigned debug)
    # After release, so the nightly release exists to attach the APK to.
    needs: [check, release]
    # Still build if one desktop target fails; the release exists either way.
    if: ${{ !cancelled() && needs.check.outputs.should_run == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Install dependencies
        run: npm ci

      # Cargo.toml builds dev dependencies at opt-level 3 so local `tauri dev`
      # runs fast. CI only checks that the app builds, so trade that for a
      # faster compile. Config-file profiles override the manifest.
      - name: Lower dependency opt-level for the debug build
        run: |
          mkdir -p .cargo
          printf '[profile.dev.package."*"]\nopt-level = 1\n' >> .cargo/config.toml

      - name: Init Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run mobile:android:init

      # arm64 only, without debug symbols: the universal unstripped build
      # is ~2.4 GB, too big to sideload. This keeps it under ~100 MB.
      - name: Build unsigned debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          CARGO_PROFILE_DEV_DEBUG: "false"
          CARGO_PROFILE_DEV_STRIP: "true"
        run: npm run mobile:android:build -- --debug --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach APK to nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$APK" treq-nightly-android-arm64.apk
          gh release upload nightly treq-nightly-android-arm64.apk --clobber

  ios:
    name: ios build (unsigned debug)
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Install dependencies
        run: npm ci

      # Cargo.toml builds dev dependencies at opt-level 3 so local `tauri dev`
      # runs fast. CI only checks that the app builds, so trade that for a
      # faster compile. Config-file profiles override the manifest.
      - name: Lower dependency opt-level for the debug build
        run: |
          mkdir -p .cargo
          printf '[profile.dev.package."*"]\nopt-level = 1\n' >> .cargo/config.toml

      - name: Init iOS project
        run: npm run mobile:ios:init

      # Device builds (the default target) always hit "Signing for treq_iOS
      # requires a development team" - xcodebuild validates automatic
      # signing before any build-setting override (env var or --no-sign)
      # gets a chance to matter, and --no-sign separately forces an
      # archive+export flow that produces an .ipa instead of the .app this
      # job uploads. See PR #495 for the full trail of what was tried.
      #
      # The Simulator SDK has no such requirement - it never needs a
      # development team, a certificate, or a provisioning profile - so
      # build for the simulator instead. That's a legitimate "unsigned
      # debug" build for this job's purpose (CI verification that the app
      # still builds for iOS), just not one that can install on a physical
      # device.
      - name: Build unsigned debug app bundle (simulator)
        run: npm run mobile:ios:build -- --debug --target aarch64-sim

      # The keystore/biometric plugins need NSFaceIDUsageDescription, which
      # the CLI merges in from src-tauri/Info.ios.plist at build time.
      - name: Assert Face ID usage string is in the built Info.plist
        run: |
          plist=$(find src-tauri/gen/apple/build -path '*.app/Info.plist' | head -n 1)
          test -n "$plist"
          plutil -extract NSFaceIDUsageDescription raw "$plist"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-app
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
          retention-days: 7
