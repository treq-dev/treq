name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
defaults:
  run:
    shell: bash
    working-directory: web

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://treq.dev' || format('https://preview-{0}.treq-9zy.pages.dev', github.event.pull_request.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "24.3"
          cache: npm
          cache-dependency-path: 'web/package-lock.json'
      - name: Restore node_modules cache
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-docs-build-${{ hashFiles('web/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        env:
          DOCUSAURUS_ENABLE_GTAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
        run: npm run build
      - name: Publish to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=main
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=treq --branch=preview-${{ github.event.pull_request.number }}
          workingDirectory: web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Install lighthouse
        run: npm install -g lighthouse
      - name: Run Lighthouse against preview site
        run: |
          lighthouse "https://preview-${{ github.event.pull_request.number }}.treq-9zy.pages.dev" \
            --output html \
            --output-path /tmp/lighthouse-report.html \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --quiet
      - name: Upload Lighthouse report
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: /tmp/lighthouse-report.html
          retention-days: 30
      - name: Comment preview and Lighthouse links on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://preview-${context.issue.number}.treq-9zy.pages.dev`;
            const artifactUrl = `${{ steps.upload.outputs.artifact-url }}`;
            const marker = '<!-- web-preview-link -->';
            const body = `${marker}\n🚀 Web preview: ${previewUrl}\n📊 Lighthouse report: ${artifactUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
