[package]
name = "treq-mobile-ssh"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "treq_mobile_ssh"

[features]
# Exposes `mock_server` (an in-process SSH server) as a public module so the
# `mock_ssh_server` example binary can serve it for the Kotlin/Swift FFI CI
# jobs. Never enabled in a normal build.
ffi-tests = []

[[example]]
name = "mock_ssh_server"
required-features = ["ffi-tests"]

[dependencies]
russh = "0.63.1"
bytes = "1"
getrandom = "0.4"
rand_core = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util"] }
thiserror = "1"
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
