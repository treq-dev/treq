[package]
name = "treq-mobile-ssh"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "treq_mobile_ssh"

[dependencies]
russh = "0.63.1"
bytes = "1"
getrandom = "0.4"
rand_core = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util"] }
thiserror = "1"
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
