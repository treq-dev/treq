id: no-manual-react-memoization
language: tsx
severity: error
message: >
  Do not use useMemo, useCallback, or memo. React Compiler memoizes
  components and values automatically.
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
rule:
  any:
    - kind: call_expression
      has:
        field: function
        regex: "^(React\\.)?(useMemo|useCallback|memo)$"
    - kind: import_specifier
      regex: "^(useMemo|useCallback|memo)$"
      inside:
        kind: named_imports
        stopBy: end
        inside:
          kind: import_statement
          stopBy: end
          regex: from ["']react["']
