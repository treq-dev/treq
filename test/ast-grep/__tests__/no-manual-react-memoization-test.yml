id: no-manual-react-memoization
valid:
  - |
    import { useEffect, useState } from "react";
    export function Count() {
      const [n, setN] = useState(0);
      const doubled = n * 2;
      const onClick = () => setN(n + 1);
      useEffect(() => {
        document.title = String(doubled);
      }, [doubled]);
      return <button onClick={onClick}>{doubled}</button>;
    }
  - |
    import * as React from "react";
    export function Box({ children }: { children: React.ReactNode }) {
      return <div>{children}</div>;
    }
invalid:
  - |
    import { useMemo } from "react";
    export function Total({ items }: { items: number[] }) {
      const sum = useMemo(() => items.reduce((a, b) => a + b, 0), [items]);
      return <span>{sum}</span>;
    }
  - |
    import { useCallback } from "react";
    export function Save({ onSave }: { onSave: () => void }) {
      const handle = useCallback(() => onSave(), [onSave]);
      return <button onClick={handle}>Save</button>;
    }
  - |
    import { memo } from "react";
    export const Row = memo(function Row() {
      return <div />;
    });
  - |
    import * as React from "react";
    export function Panel({ open }: { open: boolean }) {
      const style = React.useMemo(() => ({ display: open ? "block" : "none" }), [open]);
      const close = React.useCallback(() => {}, []);
      return <div style={style} onClick={close} />;
    }
  - |
    import React from "react";
    export const Card = React.memo(function Card() {
      return <div />;
    });
