id: no-manual-react-memoization-ts
valid:
  - |
    import { useEffect, useState } from "react";
    export function useDoubled(n: number) {
      const doubled = n * 2;
      useEffect(() => {
        document.title = String(doubled);
      }, [doubled]);
      return doubled;
    }
invalid:
  - |
    import { useMemo } from "react";
    export function useTotal(items: number[]) {
      return useMemo(() => items.reduce((a, b) => a + b, 0), [items]);
    }
  - |
    import { useCallback } from "react";
    export function useSave(onSave: () => void) {
      return useCallback(() => onSave(), [onSave]);
    }
  - |
    import * as React from "react";
    export function useStyle(open: boolean) {
      return React.useMemo(() => ({ display: open ? "block" : "none" }), [open]);
    }
